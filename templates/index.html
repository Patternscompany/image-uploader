<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f2f2f2;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px 30px;
            text-align: center;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 100px; /* enough padding bottom for footer space */
        }

        h1, h2 {
            color: #333;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        input[type="file"] {
            padding: 10px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery img {
            margin: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            width: 200px;
            height: 200px;
            object-fit: cover;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        .logo{
            width: 100px;
        }
    </style>
</head>
<body>

    <header>
    
        <img src="static/images/logo.png" alt="" class="logo">
    </header>

    <main>
        <h2>Upload New Image</h2>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" required>
            <button type="submit">Upload</button>
        </form>

        <h2>Uploaded Images</h2>
        <div class="gallery">
            {% for img in images %}
                <img src="{{ img[0] }}" alt="Uploaded Image" />
            {% endfor %}
        </div>
    </main>

    <footer>
        &copy; 2025 SARS Technologies. All rights reserved.
    </footer>

</body>
</html>
